{{ define "main" }}
<div class="max-w-4xl mx-auto px-6 py-16">
  <h1 class="text-4xl font-bold text-white mb-8">{{ .Title }}</h1>
  <div class="space-y-4">
    {{ range .Pages }}
    <a href="{{ .RelPermalink }}" class="block text-slate-300 hover:text-brand-primary transition-colors">
      {{ .Title }}
    </a>
    {{ end }}
  </div>
</div>
{{ end }}
