{{ define "main" }}
<article class="max-w-3xl mx-auto px-6 py-16">
  <header class="mb-12">
    <time class="text-sm text-brand-primary">{{ .Date.Format "2006년 1월 2일" }}</time>
    <h1 class="text-3xl md:text-4xl font-bold text-white mt-3 leading-tight">{{ .Title }}</h1>
    {{ with .Params.tags }}
    <div class="flex flex-wrap gap-2 mt-4">
      {{ range . }}
      <span class="text-xs bg-slate-800 text-slate-400 px-2 py-1 rounded">{{ . }}</span>
      {{ end }}
    </div>
    {{ end }}
    {{ with .Params.author }}
    <p class="text-slate-500 text-sm mt-4">{{ . }}</p>
    {{ end }}
  </header>

  <div class="prose prose-invert max-w-none">
    {{ .Content }}
  </div>

  <div class="mt-16 pt-8 border-t border-slate-800">
    <a href="/blog/" class="text-brand-primary hover:text-brand-accent transition-colors text-sm">
      &larr; 블로그 목록으로 돌아가기
    </a>
  </div>
</article>
{{ end }}
