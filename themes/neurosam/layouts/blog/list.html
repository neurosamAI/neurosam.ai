{{ define "main" }}
<div class="max-w-5xl mx-auto px-6 pt-24 pb-16">
  <div class="mb-14">
    <p class="text-brand-500 text-sm font-semibold tracking-wider uppercase mb-2 font-display">Blog</p>
    <h1 class="text-3xl font-extrabold text-white tracking-tight">기술, 인사이트, 그리고 여정</h1>
    <p class="text-gray-500 mt-2 text-sm">neurosam.AI 팀이 공유하는 이야기</p>
  </div>

  <div class="space-y-6">
    {{ range .Pages }}
    <article class="group">
      <a href="{{ .Permalink }}" class="block bg-white/[0.02] border border-white/[0.06] rounded-xl p-6 hover:border-brand-500/30 hover:bg-white/[0.04] transition-all duration-200">
        <div class="flex items-center gap-3 text-xs text-gray-500 mb-3">
          <time class="text-brand-500 font-medium">{{ .Date.Format "2006년 1월 2일" }}</time>
          {{ with .Params.author }}
          <span class="text-gray-700">·</span>
          <span>{{ . }}</span>
          {{ end }}
        </div>
        <h2 class="text-lg font-bold text-white group-hover:text-brand-400 transition-colors leading-snug break-keep">
          {{ .Title }}
        </h2>
        <p class="text-gray-500 mt-2 text-sm line-clamp-2 break-keep">{{ .Description }}</p>
        {{ with .Params.tags }}
        <div class="flex flex-wrap gap-1.5 mt-4">
          {{ range . }}
          <span class="text-[11px] bg-white/[0.04] text-gray-500 px-2 py-0.5 rounded border border-white/[0.06]">{{ . }}</span>
          {{ end }}
        </div>
        {{ end }}
      </a>
    </article>
    {{ end }}
  </div>
</div>
{{ end }}
