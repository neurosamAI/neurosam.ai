<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} | {{ .Site.Title }}{{ end }}</title>
<meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">
<meta name="author" content="{{ .Site.Params.author }}">

<!-- Open Graph -->
<meta property="og:title" content="{{ .Title }}">
<meta property="og:description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">
<meta property="og:type" content="{{ if .IsPage }}article{{ else }}website{{ end }}">
<meta property="og:url" content="{{ .Permalink }}">
<meta property="og:site_name" content="{{ .Site.Title }}">

<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          'brand-dark': '#0f172a',
          'brand-primary': '#3b82f6',
          'brand-accent': '#8b5cf6',
        }
      }
    }
  }
</script>

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">

<style>
  body { font-family: 'Noto Sans KR', sans-serif; }
  .prose h1, .prose h2, .prose h3 { color: #f1f5f9; }
  .prose p, .prose li { color: #cbd5e1; }
  .prose a { color: #3b82f6; }
  .prose a:hover { color: #8b5cf6; }
  .prose strong { color: #f1f5f9; }
  .prose code { color: #e2e8f0; background: #1e293b; padding: 2px 6px; border-radius: 4px; }
  .prose pre { background: #1e293b; border-radius: 8px; padding: 1rem; overflow-x: auto; }
  .prose pre code { background: none; padding: 0; }
  .prose blockquote { border-left-color: #3b82f6; color: #94a3b8; }
  .prose table { width: 100%; }
  .prose th { color: #f1f5f9; background: #1e293b; padding: 0.75rem; text-align: left; }
  .prose td { color: #cbd5e1; padding: 0.75rem; border-bottom: 1px solid #334155; }
  .prose hr { border-color: #334155; }
</style>
