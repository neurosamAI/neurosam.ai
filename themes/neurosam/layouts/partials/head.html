<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} | {{ .Site.Title }}{{ end }}</title>
<meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">
<meta name="author" content="{{ .Site.Params.author }}">

<!-- Open Graph -->
<meta property="og:title" content="{{ .Title }}">
<meta property="og:description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">
<meta property="og:type" content="{{ if .IsPage }}article{{ else }}website{{ end }}">
<meta property="og:url" content="{{ .Permalink }}">
<meta property="og:site_name" content="{{ .Site.Title }}">

<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          'brand-dark': '#0f172a',
          'brand-primary': '#3b82f6',
          'brand-accent': '#8b5cf6',
        }
      }
    }
  }
</script>

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">

<style>
  body { font-family: 'Noto Sans KR', sans-serif; }

  /* 본문 기본 */
  .prose { font-size: 1.0625rem; line-height: 1.9; color: #e2e8f0; }

  /* 제목 */
  .prose h1 { font-size: 2rem; font-weight: 800; color: #f8fafc; margin-top: 3rem; margin-bottom: 1rem; letter-spacing: -0.02em; }
  .prose h2 { font-size: 1.5rem; font-weight: 700; color: #f1f5f9; margin-top: 2.5rem; margin-bottom: 0.75rem; padding-bottom: 0.5rem; border-bottom: 1px solid #1e293b; }
  .prose h3 { font-size: 1.25rem; font-weight: 600; color: #e2e8f0; margin-top: 2rem; margin-bottom: 0.5rem; }

  /* 문단 */
  .prose p { color: #cbd5e1; margin-bottom: 1.25rem; word-break: keep-all; }

  /* 링크 */
  .prose a { color: #60a5fa; text-decoration: underline; text-underline-offset: 3px; text-decoration-color: #60a5fa40; }
  .prose a:hover { color: #a78bfa; text-decoration-color: #a78bfa80; }

  /* 강조 */
  .prose strong { color: #f1f5f9; font-weight: 600; }

  /* 리스트 */
  .prose ul { list-style-type: disc; padding-left: 1.5rem; margin-bottom: 1.25rem; }
  .prose ol { list-style-type: decimal; padding-left: 1.5rem; margin-bottom: 1.25rem; }
  .prose li { color: #cbd5e1; margin-bottom: 0.5rem; line-height: 1.8; }
  .prose li::marker { color: #64748b; }

  /* 인용 */
  .prose blockquote {
    border-left: 3px solid #3b82f6;
    background: #1e293b40;
    padding: 1rem 1.25rem;
    margin: 1.5rem 0;
    border-radius: 0 8px 8px 0;
    color: #94a3b8;
    font-style: italic;
  }
  .prose blockquote p { color: #94a3b8; margin-bottom: 0; }
  .prose blockquote strong { color: #e2e8f0; }

  /* 코드 */
  .prose code { color: #e2e8f0; background: #1e293b; padding: 2px 6px; border-radius: 4px; font-size: 0.9em; }
  .prose pre { background: #0f172a; border: 1px solid #1e293b; border-radius: 8px; padding: 1.25rem; overflow-x: auto; margin: 1.5rem 0; }
  .prose pre code { background: none; padding: 0; font-size: 0.875rem; line-height: 1.7; color: #e2e8f0; }

  /* 테이블 */
  .prose table { width: 100%; border-collapse: collapse; margin: 1.5rem 0; font-size: 0.9375rem; }
  .prose thead { border-bottom: 2px solid #334155; }
  .prose th { color: #f1f5f9; background: #1e293b; padding: 0.75rem 1rem; text-align: left; font-weight: 600; }
  .prose td { color: #cbd5e1; padding: 0.75rem 1rem; border-bottom: 1px solid #1e293b; }
  .prose tr:hover td { background: #1e293b30; }

  /* 구분선 */
  .prose hr { border: none; border-top: 1px solid #334155; margin: 2.5rem 0; }

  /* 이미지 */
  .prose img { border-radius: 8px; margin: 1.5rem 0; }
</style>
