{{/* Mobile-only sticky CTA bar — hidden on md+ screens, dismissable */}}
<div id="sticky-cta" class="md:hidden fixed bottom-0 left-0 right-0 z-40 transition-transform duration-300 translate-y-0">
  <div class="bg-brand-950/95 backdrop-blur-xl border-t border-white/[0.08] px-4 py-3 shadow-2xl shadow-black/40">
    <div class="flex items-center gap-3">
      <div class="flex-1 min-w-0">
        <p class="text-white text-xs font-semibold leading-snug truncate">{{ i18n "sticky_title" }}</p>
        <p class="text-gray-400 text-[10px] leading-snug truncate">{{ i18n "sticky_sub" }}</p>
      </div>
      <a href="{{ "/" | relLangURL }}#contact" data-cta-label="도입 상담" data-cta-location="sticky-mobile" class="shrink-0 inline-flex items-center justify-center px-4 py-2.5 bg-brand-500 hover:bg-brand-600 text-white text-xs font-bold rounded-lg whitespace-nowrap shadow-lg shadow-brand-500/30">
        {{ i18n "cta_consult" }}
        <i class="fa-solid fa-arrow-right ml-1.5 text-[10px]"></i>
      </a>
      <button onclick="document.getElementById('sticky-cta').classList.add('translate-y-full'); sessionStorage.setItem('sticky-cta-dismissed','1');" class="shrink-0 w-8 h-8 flex items-center justify-center text-gray-500 hover:text-gray-300" aria-label="{{ i18n "aria_close" }}">
        <i class="fa-solid fa-xmark text-sm"></i>
      </button>
    </div>
  </div>
</div>
<script>
  (function(){
    if (sessionStorage.getItem('sticky-cta-dismissed') === '1') {
      var el = document.getElementById('sticky-cta');
      if (el) el.classList.add('translate-y-full');
    }
  })();
</script>
